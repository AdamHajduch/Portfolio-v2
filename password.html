<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password protected</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f9f7f4;
      color: #140f0b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Figtree', sans-serif;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 64px;
      width: 400px;
    }

    .case-label {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #746d67;
      margin-bottom: 4px;
    }

    .case-title {
      font-family: 'Figtree', sans-serif;
      font-weight: 500;
      font-size: 40px;
      letter-spacing: -1px;
      color: #140f0b;
      margin-bottom: 4px;
    }

    .case-body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 400;
      font-size: 18px;
      line-height: 32px;
      color: #3a3836;
    }

    .input-row {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    input[type="password"] {
      width: 100%;
      height: 44px;
      padding: 0 16px;
      border: 1.5px solid #d4cfc9;
      background: #f9f7f4;
      font-family: 'Figtree', sans-serif;
      font-size: 16px;
      color: #140f0b;
      outline: none;
      transition: border-color 0.15s ease;
    }

    input[type="password"]::placeholder { color: #a09890; }
    input[type="password"]:focus        { border-color: #140f0b; }

    input[type="password"].error {
      border-color: #c0392b;
      animation: shake 0.3s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25%       { transform: translateX(-6px); }
      75%       { transform: translateX(6px); }
    }

    .error-msg {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13px;
      color: #c0392b;
      display: none;
    }

    .error-msg.visible { display: block; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #140f0b;
      color: #fcfbf9;
      font-family: 'Figtree', sans-serif;
      font-weight: 500;
      font-size: 16px;
      line-height: 20px;
      padding: 12px 20px;
      text-decoration: none;
      white-space: nowrap;
      border: none;
      cursor: pointer;
      transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
    }

    .btn:hover  { background: #281F15; box-shadow: 0px 4px 8px rgba(20,15,11,0.12), 0px 8px 16px rgba(20,15,11,0.03); }
    .btn:active { background: #37291A; transform: scale(0.98); }

    .back-link {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px;
      color: #746d67;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s ease;
    }

    .back-link:hover { color: #140f0b; }
    .back-link svg { transition: transform 0.15s ease; }
    .back-link:hover svg { transform: translateX(-3px); }
  </style>
</head>
<body>

  <div class="card">
    <div>
      <p class="case-label">NDA · Password required</p>
      <p class="case-title">This case study<br>is protected.</p>
      <p class="case-body">This project is covered by a non-disclosure agreement. If you have access, enter the password below.</p>
    </div>

    <div class="input-row">
      <input type="password" id="pwd" placeholder="Enter password" autocomplete="off">
      <span class="error-msg" id="err">Incorrect password. Try again.</span>
      <button class="btn" onclick="checkPassword()">Unlock case study</button>
    </div>

    <a href="index.html" class="back-link">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 6H1M1 6L6 1M1 6L6 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back to Home
    </a>
  </div>

  <script>
    const PASSWORD = 'neviem';

    const params = new URLSearchParams(window.location.search);
    const next = params.get('next') || 'index.html';

    function checkPassword() {
      const input = document.getElementById('pwd');
      const err = document.getElementById('err');
      input.classList.remove('error');
      void input.offsetWidth;
      if (input.value !== PASSWORD) {
        input.classList.add('error');
        err.classList.add('visible');
      } else {
        sessionStorage.setItem('portfolio_auth', '1');
        window.location.href = next;
      }
    }

    document.getElementById('pwd').addEventListener('keydown', e => {
      if (e.key === 'Enter') checkPassword();
    });
  </script>

</body>
</html>
